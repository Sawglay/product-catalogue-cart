services:
  frontend-web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend-web:/usr/share/nginx/html:ro
      - ./frontend-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api

  backend-api:
    build:
      context: ./backend-api
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-db:5432/backend_api
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: backend_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data-18-mac:/var/lib/postgresql
      - ./backend-api/database/001-database-creation.sql:/docker-entrypoint-initdb.d/001-database-creation.sql:ro
      - ./backend-api/database/002-seed-data.sql:/docker-entrypoint-initdb.d/002-seed-data.sql:ro

volumes:
  postgres-data-18-mac:
